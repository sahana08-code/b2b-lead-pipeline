spring.datasource.url=jdbc:mysql://localhost:3307/b2b_lead_pipeline
spring.datasource.username=root
# The password is NOT stored in the code. Set it as an environment variable before running:
#   Windows PowerShell:  $env:DB_PASSWORD="your_mysql_password"
#   Windows cmd:         set DB_PASSWORD=your_mysql_password
spring.datasource.password=${DB_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-message=always
server.error.include-binding-errors=always
