# Demo mode: runs with an in-memory database, no MySQL needed.
# Data is lost when the app stops. Start with:  -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:b2b_lead_pipeline;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
